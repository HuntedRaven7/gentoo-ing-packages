# gentoo-ing CI/systemd make.conf
# Target: container/VM desktop with GNOME, systemd, flatpak

CFLAGS="-O2 -pipe"
CXXFLAGS="${CFLAGS}"
LDFLAGS="-Wl,--hash-style=gnu"

# Systemd is the only init system we support
USE="systemd elogind udev"

# Desktop/GNOME
USE="${USE} gtk wayland X"

# Build-time automation
USE="${USE} cargo go rust-bin"

# Common runtime
USE="${USE} -static-libs"
