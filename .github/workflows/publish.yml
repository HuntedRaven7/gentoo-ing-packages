---
name: Build and Publish Binhost

on:
  push:
    branches:
      - main
    paths:
      - "Containerfile"
      - "Justfile"
      - "config/**"
      - "ebuilds/**"
      - "packages/**"
      - "tools/**"
      - ".github/workflows/*"
  schedule:
    # Update cycle (every 2 days): a fresh portage tree (SYNC_PORTAGE=1) lets
    # -uDN move the full overlay set (and its dependency closure) to current
    # stable versions, both compiled gaps and mirrored official binaries. The
    # manifest-diff step then skips the push entirely when nothing moved, so the
    # registry only advances when a package actually changes.
    - cron: "30 3 */2 * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write
  attestations: write

env:
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_VENDOR: "${{ github.repository_owner }}"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    permissions:
      contents: read
      packages: write
      pages: write
      id-token: write
      attestations: write
    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_VENDOR,,}" >> "${GITHUB_ENV}"
          # Scheduled update cycle refreshes the portage tree so updates are
          # discovered; normal pushes reuse the tree as-is.
          sync=0
          [ "${{ github.event_name }}" = "schedule" ] && sync=1
          echo "SYNC_PORTAGE=${sync}" >> "${GITHUB_ENV}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate
        run: python3 tools/validate.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # sccache round-trip: restore the previous run's compile cache, feed it to
      # the builder as the `sccache-prime` context (Containerfile primes
      # /var/cache/sccache from it), extract the grown cache back out of the
      # built maker image, and the post-step below saves it. Unchanged compiles
      # (bootc/gum/just/kernel now, GNOME later) are not re-done on every run.
      - name: Restore sccache from the cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/sccache-cache
          key: sccache-${{ hashFiles('config/packages.txt', 'ebuilds/**') }}
          restore-keys: |
            sccache-
          save-always: 'true'

      - name: Ensure sccache prime dir exists (first run is empty = cold start)
        run: mkdir -p /tmp/sccache-cache

      - name: Load current published manifest (if any)
        id: baseline
        run: |
          set -x
          docker pull ghcr.io/${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest || true
          if docker image inspect ghcr.io/${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest >/dev/null 2>&1; then
            cid=$(docker create ghcr.io/${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest /bin/sh)
            docker cp "${cid}:/var/cache/binhost/gentoo-ing/.manifest" /tmp/baseline.manifest || true
            docker rm "${cid}" >/dev/null
          fi

      - name: Build binhost image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Containerfile
          push: false
          load: true
          tags: localhost/${{ env.IMAGE_NAME }}:local
          build-contexts: |
            sccache-prime=/tmp/sccache-cache
          build-args: |
            SYNC_PORTAGE=${{ env.SYNC_PORTAGE }}

      - name: Build maker image (for security scanning)
        id: build-maker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Containerfile
          target: maker
          push: false
          load: true
          tags: localhost/${{ env.IMAGE_NAME }}:maker
          build-contexts: |
            sccache-prime=/tmp/sccache-cache
          build-args: |
            SYNC_PORTAGE=${{ env.SYNC_PORTAGE }}

      - name: Diff package set against published overlay
        id: diff
        run: |
          cid=$(docker create localhost/${{ env.IMAGE_NAME }}:local /bin/sh)
          docker cp "${cid}:/var/cache/binhost/gentoo-ing/.manifest" /tmp/new.manifest
          docker rm "${cid}" >/dev/null
          if [ -f /tmp/baseline.manifest ] && cmp -s /tmp/baseline.manifest /tmp/new.manifest; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "::notice title=update cycle::no package version changed; skipping publish"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            [ -f /tmp/baseline.manifest ] && diff -u /tmp/baseline.manifest /tmp/new.manifest || true
          fi
          cat /tmp/new.manifest

      # Pull the grown sccache out of the built maker image so the next run's
      # restore step feeds it back in (the cache lives in the maker's layer,
      # not in the published binhost image).
      - name: Extract sccache from the built maker
        run: |
          rm -rf /tmp/sccache-cache
          mkdir -p /tmp/sccache-cache
          cid=$(docker create localhost/${{ env.IMAGE_NAME }}:maker /bin/sh)
          docker cp "${cid}:/var/cache/sccache/." /tmp/sccache-cache/ || true
          docker rm "${cid}" >/dev/null
          du -sh /tmp/sccache-cache 2>/dev/null || true

      - name: Login to GitHub Container Registry
        if: steps.diff.outputs.changed == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images to GHCR
        id: push
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -eoux pipefail
          for tag in latest "${{ github.sha }}"; do
            docker tag localhost/${{ env.IMAGE_NAME }}:local \
              ghcr.io/${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${tag}
            docker push ghcr.io/${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${tag}
          done
          docker tag localhost/${{ env.IMAGE_NAME }}:maker \
            ghcr.io/${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:maker
          docker push ghcr.io/${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:maker
          digest=$(docker image inspect ghcr.io/${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            --format '{{index .RepoDigests 0}}')
          echo "digest=${digest##*@}" >> "${GITHUB_OUTPUT}"

      - name: Attest build provenance
        if: steps.diff.outputs.changed == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}

      - name: Report digest for consumer pin
        if: steps.diff.outputs.changed == 'true'
        run: |
          echo "::notice title=consumer pin::ghcr.io/${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

  # syft + grype on the built packages, surfaced as Code Scanning alerts in the
  # Security tab. Scans the `maker` stage (the image that actually compiled the
  # gap set), so CVEs are attributable to what we publish. Never fails the
  # build: this is a report, not a gate.
  security-scan:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: always() && !cancelled() && needs.publish.result == 'success'
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_VENDOR,,}" >> "${GITHUB_ENV}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Export GHCR auth for scanners
        run: |
          token=$(printf '%s:%s' "${{ github.actor }}" "${{ secrets.GITHUB_TOKEN }}" | base64 -w0)
          echo "DOCKER_AUTH_CONFIG={\"auths\":{\"ghcr.io\":{\"auth\":\"${token}\"}}}" >> "${GITHUB_ENV}"

      - name: Generate SBOM (syft)
        id: sbom
        uses: anchore/sbom-action@006b7ce8314066bdf1765b4500370d40fa6917a3 # v0.24.2
        with:
          image: ghcr.io/${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:maker
          format: cyclonedx-json
          artifact-name: sbom-${{ env.IMAGE_NAME }}-maker
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan with Grype (report only, never fails)
        id: scan
        uses: anchore/scan-action@8576240a41341d866dbd7ebc72cd9fc0ef023f54 # v7.4.2
        with:
          image: ghcr.io/${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:maker
          fail-build: "false"
          severity-cutoff: medium
          output-format: sarif
          output-file: results.sarif
          by-cve: "true"
          cache-db: "true"

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

  # Mirror the published cache as a plain HTTP Gentoo binrepo on GitHub Pages:
  # `PORTAGE_BINHOST=https://HuntedRaven7.github.io/gentoo-ing-packages/` lets a
  # stock Gentoo box `emerge --getbinpkg --usepkgonly` without pulling any
  # container image. Mirrored only when a new :latest was actually pushed.
  # continue-on-error: Pages must be enabled with the "GitHub Actions" source in
  # repo settings; until then this job reports its reason and stays non-blocking.
  publish-pages:
    needs: publish
    if: needs.publish.result == 'success' && needs.publish.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      packages: read
      pages: write
      id-token: write
    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_VENDOR,,}" >> "${GITHUB_ENV}"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract overlay for the HTTP binrepo
        run: |
          docker pull ghcr.io/${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          rm -rf _site
          mkdir -p _site
          cid=$(docker create ghcr.io/${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:latest /bin/sh)
          docker cp "${cid}:/var/cache/binhost/gentoo-ing/." _site/
          docker rm "${cid}" >/dev/null
          test -s _site/Packages && echo "HTTP binrepo prepared: $(du -sh _site | cut -f1)"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4