---
name: Verify Upstream Sources

on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
    inputs:
      package:
        description: Direct-upstream package name; leave empty for all configured packages
        required: false

permissions:
  contents: read

concurrency:
  group: verify-sources
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@a5b2315a63bdd29d6e1f06da5b9d37b9b76b0605 # v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install --quiet requests pyyaml
      - name: Fetch, verify, and report
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          if [ -n "$PACKAGE" ]; then
            python3 tools/verify-sources.py "$PACKAGE"
          else
            python3 tools/verify-sources.py
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: source-verification-report
          path: reports/verify-sources/
          if-no-files-found: ignore
