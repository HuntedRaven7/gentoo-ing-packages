---
name: Validate

on:
  pull_request:
    branches:
      - main
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "Validate repo (composite: hadolint + shellcheck + pre-commit)"
        uses: projectbluefin/actions/bootc-build/validate-pr@eb4c546389f19ad9e42f1af052623de73c620ebb # v1
        with:
          dockerfile: Containerfile
          hadolint-config: .hadolint.yaml

      - name: Validate binhost tree and config
        run: python3 tools/validate.py

      - name: Check parity with gentoo-ing build list
        run: python3 tools/sync-check.py
        shell: bash